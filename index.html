<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <title>Skull Snake</title>
    
    <!-- Open Graph / Twitter Card -->
    <link rel="canonical" href="https://skullsnake.netlify.app/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Skull Snake">
    <meta property="og:description" content="Jogo Skull Snake — divirta-se e compartilhe com seus amigos.">
    <meta property="og:url" content="https://skullsnake.netlify.app/">
    <meta property="og:image" content="./assets/favicon.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Skull Snake">
    <meta name="twitter:description" content="Jogo Skull Snake — divirta-se e compartilhe com seus amigos.">
    <meta name="twitter:image" content="./assets/favicon.png">
    <meta name="twitter:image:width" content="1200">
    <meta name="twitter:image:height" content="630">
</head>
<body>
    <div class="game-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="mobile-console" aria-label="Controles do jogo para celular">
       

        <div class="mobile-controls" aria-label="Controles de direção para celular">
            <div class="control-pad" aria-label="Direção">
                <button class="control-btn control-up" data-direction="up" aria-label="Mover para cima">▲</button>
                <div class="control-row">
                    <button class="control-btn" data-direction="left" aria-label="Mover para esquerda">◀</button>
                    <button class="control-btn control-down" data-direction="down" aria-label="Mover para baixo">▼</button>
                    <button class="control-btn" data-direction="right" aria-label="Mover para direita">▶</button>
                </div>
            </div>
            <button class="speed-btn" data-action="accelerate" aria-label="Acelerar">Boost</button>
        </div>

         <div class="console-actions">
            <button class="gameboy-btn start-btn" data-action="start" aria-label="Iniciar jogo">Start</button>
            <button class="gameboy-btn pause-btn" data-action="pause" aria-label="Pausar jogo">Pause</button>
        </div>
        
    </div>

    <div class="contact-widget">
        <button id="contact-toggle" class="contact-toggle-btn">Contato</button>
        <div class="contacts-panel" id="contacts-panel">
            <h2>Contato</h2>
            <p>Gostou do jogo? Vamos construir algo incrível juntos!</p>
            <div class="contacts-links">
                <a href="https://wa.me/+5551998807209" target="_blank" class="btn-contact whatsapp">
                    <img src="./assets/whatsapp.png" alt="icone whatsapp">
                    <span>WhatsApp</span>
                </a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=elisandroferrari.efcode@gmail.com" target="_blank" class="btn-contact gmail">
                    <img src="./assets/gmail.png" alt="icone Gmail">
                    <span>Gmail</span>
                </a>
                <a href="https://www.linkedin.com/in/elisandro-ferrari/" target="_blank" class="btn-contact linkedin">
                    <img src="./assets/linkedin.png" alt="icone linkedin">
                    <span>LinkedIn</span>
                </a>
            </div>
            <div class="share-card">
                <img src="./assets/favicon.png" alt="Skull Snake" class="share-card-img">
                <div class="share-card-info">
                    <h3>Skull Snake</h3>
                    <p>Compartilhe o link deste jogo com seus amigos.</p>
                    <button id="share-link-btn" class="share-button">Copiar link</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>&lt;EFcode /&gt;©™ - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
