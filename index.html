<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="./assets/favicon.png" type="image/png">
    <title>Skull Snake</title>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="canvas"></canvas>
    </div>

    <div class="contact-widget">
        <button id="contact-toggle" class="contact-toggle-btn">Contato</button>
        <div class="contacts-panel" id="contacts-panel">
            <h2>Contato</h2>
            <p>Gostou do jogo? Vamos construir algo incrível juntos!</p>
            <div class="contacts-links">
                <a href="https://wa.me/+5551998807209" target="_blank" class="btn-contact whatsapp">
                    <img src="./assets/whatsapp.png" alt="icone whatsapp">
                    <span>WhatsApp</span>
                </a>
                <a href="https://mail.google.com/mail/?view=cm&fs=1&to=elisandroferrari.efcode@gmail.com" target="_blank" class="btn-contact gmail">
                    <img src="./assets/gmail.png" alt="icone Gmail">
                    <span>Gmail</span>
                </a>
                <a href="https://www.linkedin.com/in/elisandro-ferrari/" target="_blank" class="btn-contact linkedin">
                    <img src="./assets/linkedin.png" alt="icone linkedin">
                    <span>LinkedIn</span>
                </a>
            </div>
            <div class="share-card">
                <img src="./assets/favicon.png" alt="Skull Snake" class="share-card-img">
                <div class="share-card-info">
                    <h3>Skull Snake</h3>
                    <p>Compartilhe o link deste jogo com seus amigos.</p>
                    <button id="share-link-btn" class="share-button">Copiar link</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="main-footer">
        <p>&lt;EFcode /&gt;©™ - Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
